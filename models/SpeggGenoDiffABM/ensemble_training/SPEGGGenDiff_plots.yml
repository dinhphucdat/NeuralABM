# Plot the evolution of the training loss
loss:
  based_on: loss
  style:
    figure.figsize: [ !dag_result full_width, !dag_result third_width ]

# Plot the evolution of the parameters
predictions:
  based_on: predictions_uni

# Plot the marginals of all the parameters
marginals:
  based_on:
    - .creator.universe
    - .plot.facet_grid.density
  select:
    parameters:
      path: parameters
      transform: [.data]
    probabilities:
      path: loss
      transform: [neg_exp]
  transform:
    - broadcast: [!dag_tag parameters, !dag_tag probabilities]
    - xr.DataArray:
        data: [100, 100, 100]
        dims: ['parameter']
        coords: {parameter: [loci_1_recombination_rates, loci_2_recombination_rates, loci_3_recombination_rates]} # To be determined ...
      tag: bins
    - xr.DataArray:
        data: [[[0, 1], [~, ~]], [[1, 30], [~, ~]], [[1, 30], [~, ~]]]
        dims: ['parameter', 'dim1', 'dim0']
        coords: {parameter: [loci_1_recombination_rates, loci_2_recombination_rates, loci_3_recombination_rates]} # To be determined ...
      tag: ranges
    - marginal_from_ds: [!dag_node -3, !dag_tag bins, !dag_tag ranges ]
      kwargs:
        x: x
        y: loss
        statistic: mean
        exclude_dim: [parameter]
      tag: data
  x: x
  y: y
  sharex: False
  sharey: False
  col: parameter
  smooth_kwargs:
    enabled: False
    smoothing: 20

